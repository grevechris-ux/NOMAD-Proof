name: Verify signed release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release policy and verifier
        uses: actions/checkout@v4
      - name: Download release manifests and referenced platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          mkdir -p "$RUNNER_TEMP/nomad-release-assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/nomad-release-assets"             --pattern 'linux-stable.json' --pattern 'windows-stable.json' --pattern 'android-stable.json'             --pattern '*.tar.gz' --pattern '*.exe' --pattern '*.apk'
      - name: Verify Ed25519 manifests, release URLs, sizes and SHA-256
        run: node tools/verify_release_assets.mjs "$RUNNER_TEMP/nomad-release-assets"
